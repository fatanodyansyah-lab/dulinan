<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Golden Piano Tiles</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="stage">
  <audio id="song" src="assets/golden-song.mp3" preload="auto"></audio>
  <video id="bgVideo" src="assets/background.mp4" muted loop playsinline autoplay preload="auto"></video>
  <div id="scrim"></div>

  <div id="lanes" aria-hidden="true">
    <div class="lane lane-border"></div>
    <div class="lane lane-border"></div>
    <div class="lane"></div>
  </div>

  <div id="tilesLayer"></div>

  <div id="hitLine"></div>
  <div id="hitGlow"></div>

  <div id="tapZones">
    <div class="tapZone" data-lane="0"></div>
    <div class="tapZone" data-lane="1"></div>
    <div class="tapZone" data-lane="2"></div>
  </div>

  <a id="homeBtn" href="../../index.html" aria-label="Kembali ke menu utama">
    <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
      <path d="M12 3 2 12h3v8h6v-5h2v5h6v-8h3z" fill="currentColor"/>
    </svg>
  </a>

  <!-- HUD (playing) -->
  <div id="hud" hidden>
    <div class="hudRow">
      <div class="hudChip">
        <div id="scoreValue" class="hudScore">0</div>
        <div class="hudLabel">SKOR</div>
      </div>
      <div class="hudChip">
        <div id="comboValue" class="hudCombo">0</div>
        <div class="hudLabel">COMBO</div>
      </div>
    </div>
    <div class="progressTrack">
      <div id="progressFill" class="progressFill"></div>
    </div>
  </div>
  <div id="comboPopup" hidden></div>

  <!-- START -->
  <div id="menuScreen" class="overlay">
    <div class="titleBlock">
      <div class="titleMain">GOLDEN</div>
      <div class="titleSub">PIANO TILES</div>
    </div>
    <div class="instrCard">
      Ketuk ubin emas mengikuti irama lagu.<br>
      Ubin panjang: <b>tekan &amp; tahan</b> sampai ujung!
    </div>
    <div id="highScoreLine" class="highScoreLine" hidden>🏆 Skor tertinggi: 0</div>
    <button type="button" id="btnMain" class="btnGold">MAIN</button>
    <div class="footerNote">🎵 mengikuti irama lagumu</div>
  </div>

  <!-- GAME OVER -->
  <div id="overScreen" class="overlay" hidden>
    <div class="resultCard">
      <div id="resultTitle" class="resultTitle">Yah, meleset!</div>
      <div id="finalScore" class="finalScore">0</div>
      <div class="finalLabel">SKOR</div>
      <div id="bestBadge" class="bestBadge" hidden>🎉 Rekor baru!</div>
      <div id="bestLine" class="bestLine" hidden>Tertinggi: 0</div>
      <div id="bestComboLine" class="bestComboLine">Combo terbaik: 0</div>
    </div>
    <button type="button" id="btnReplay" class="btnGold btnMd">Main lagi</button>
    <button type="button" id="btnMenu" class="btnText">Kembali ke menu</button>
  </div>
</div>
<script src="game.js"></script>
</body>
</html>
