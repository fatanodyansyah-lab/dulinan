<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>K-Pop Hunter Fashion</title>
<link rel="stylesheet" href="style.css?v=2">
</head>
<body>
<div id="app">
  <!-- soft neon sparkles -->
  <div class="sparkle sparkle-1" aria-hidden="true"></div>
  <div class="sparkle sparkle-2" aria-hidden="true"></div>
  <div class="sparkle sparkle-3" aria-hidden="true"></div>

  <a id="homeBtn" href="../../index.html" aria-label="Kembali ke menu utama">
    <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
      <path d="M12 3 2 12h3v8h6v-5h2v5h6v-8h3z" fill="currentColor"/>
    </svg>
  </a>

  <!-- START -->
  <section id="screen-start" class="screen screen-start" hidden>
    <div class="badge">DRESS UP GAME</div>
    <h1 class="title-start">K-Pop Hunter<br>Fashion</h1>
    <p class="subtitle">Pilih outfit konser untuk Rumi, Mira &amp; Zoey — lalu saksikan mereka tampil di panggung!</p>
    <div id="start-minis" class="minis-row"></div>
    <button type="button" id="btn-start" class="btn-primary">Mulai!</button>
    <div class="hint-chip">Ketuk item untuk memakai · ketuk lagi untuk melepas</div>
  </section>

  <!-- DRESS -->
  <section id="screen-dress" class="screen screen-dress" hidden>
    <header class="dress-header">
      <div id="girl-tabs" class="girl-tabs"></div>
      <button type="button" id="btn-music-dress" class="btn-ghost-sm">♪ Musik OFF</button>
    </header>
    <div class="char-stage">
      <div class="stage-floor stage-floor-sm" aria-hidden="true"></div>
      <div class="spotlight spotlight-dress" aria-hidden="true"></div>
      <div id="dress-doll" class="doll doll-dress"></div>
    </div>
    <div id="cat-tabs" class="cat-tabs"></div>
    <div class="item-grid-wrap">
      <div id="item-grid" class="item-grid"></div>
    </div>
    <footer class="dress-footer">
      <button type="button" id="btn-reset" class="btn-ghost">Reset</button>
      <button type="button" id="btn-next" class="btn-primary btn-grow">Lanjut</button>
    </footer>
  </section>

  <!-- STAGE -->
  <section id="screen-stage" class="screen screen-stage" hidden>
    <div id="confetti-layer" class="confetti-layer" aria-hidden="true"></div>
    <div class="spotlight spotlight-l" aria-hidden="true"></div>
    <div class="spotlight spotlight-c" aria-hidden="true"></div>
    <div class="spotlight spotlight-r" aria-hidden="true"></div>
    <div class="stage-title-block">
      <div class="encore-label">ENCORE STAGE</div>
      <h1 id="group-name" class="title-stage">LUNARIX</h1>
    </div>
    <div id="stage-dolls" class="stage-dolls"></div>
    <div class="stage-floor stage-floor-lg" aria-hidden="true"></div>
    <p class="stage-hint">Ketuk salah satu gadis untuk mengubah outfitnya</p>
    <div class="stage-actions">
      <button type="button" id="btn-play-again" class="btn-primary btn-md">Main Lagi</button>
      <button type="button" id="btn-music-stage" class="btn-ghost-md">♪ Musik OFF</button>
    </div>
  </section>
</div>
<script src="game.js"></script>
</body>
</html>
