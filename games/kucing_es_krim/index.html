<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Kucing Es Krim</title>
<style>
  html,body{margin:0;padding:0;height:100%;background:#3a2a24;overflow:hidden;overscroll-behavior:none;touch-action:none;-webkit-user-select:none;user-select:none}
  canvas{display:block;margin:0 auto;touch-action:none}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
// ---------- block accidental zoom (iOS ignores user-scalable=no) ----------
(function blockZoom() {
  const stopMulti = (e) => {
    if (e.touches && e.touches.length > 1) e.preventDefault();
  };
  document.addEventListener('touchstart', stopMulti, { passive: false });
  document.addEventListener('touchmove', stopMulti, { passive: false });

  ['gesturestart', 'gesturechange', 'gestureend'].forEach((type) => {
    document.addEventListener(type, (e) => e.preventDefault(), { passive: false });
  });

  let lastTap = { t: 0, x: 0, y: 0 };
  document.addEventListener('touchend', (e) => {
    const touch = e.changedTouches && e.changedTouches[0];
    if (!touch) return;
    const now = Date.now();
    const x = touch.clientX;
    const y = touch.clientY;
    const dt = now - lastTap.t;
    const dist = Math.hypot(x - lastTap.x, y - lastTap.y);
    if (dt <= 300 && dist < 28) e.preventDefault();
    lastTap = { t: now, x, y };
  }, { passive: false });

  document.addEventListener('wheel', (e) => {
    if (e.ctrlKey) e.preventDefault();
  }, { passive: false });
})();

let W=480,H=854;
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
let scale=1,stateReady=false;
function tabletLandscape(){
  return window.innerWidth>=768&&window.innerHeight>=560&&window.innerWidth>window.innerHeight;
}
function resize(){
  const vw=window.innerWidth,vh=window.innerHeight;
  const oldW=W,oldH=H;
  W=tabletLandscape()?960:480;
  H=tabletLandscape()?Math.round(Math.max(600,Math.min(720,960*vh/vw))):854;
  if(stateReady&&(oldW!==W||oldH!==H)){
    const sx=W/oldW,sy=H/oldH;
    catX*=sx;targetX*=sx;
    items.forEach(it=>{it.x*=sx;it.y*=sy;});
    particles.forEach(p=>{p.x*=sx;p.y*=sy;});
    popups.forEach(p=>{p.x*=sx;p.y*=sy;});
    CAT_Y=H-215;
  }
  scale=Math.min(vw/W,vh/H);
  cv.width=W*Math.min(devicePixelRatio,2);cv.height=H*Math.min(devicePixelRatio,2);
  cv.style.width=(W*scale)+'px';cv.style.height=(H*scale)+'px';
  cv.style.marginTop=Math.max(0,(vh-H*scale)/2)+'px';
  ctx.setTransform(Math.min(devicePixelRatio,2),0,0,Math.min(devicePixelRatio,2),0,0);
}
window.addEventListener('resize',resize);resize();

// ------- audio -------
const music=new Audio('assets/music.mp3');music.loop=true;music.volume=0.6;
let muted=false;
function tryMusic(){if(!muted){music.play().catch(()=>{});}}

// ------- state -------
const SCOOP_COLORS=[['#7fd8c8','#5bbfae'],['#f6a1b5','#e87f98'],['#f7d774','#e8bd4a'],['#c3a1e8','#a97fd4'],['#f7b27f','#e8945a']];
let state='start'; // start | play | over
let catX=W/2, targetX=W/2;
let items=[], particles=[], popups=[];
let score=0, best=+(localStorage.getItem('kucing_es_best')||0);
let lives=3, stack=[], combo=0;
let t=0, spawnTimer=0, elapsed=0;
let shake=0, hurtFlash=0, catMood=0; // catMood>0 happy, <0 sad
let holdDir=0, dragging=false;
let CAT_Y=H-215;
stateReady=true;

function reset(){
  items=[];particles=[];popups=[];score=0;lives=3;stack=[];combo=0;
  elapsed=0;spawnTimer=0;catX=W/2;targetX=W/2;shake=0;hurtFlash=0;
}

// difficulty curves
function fallSpeed(){return 2.2+Math.min(6,elapsed/18);}
function spawnEvery(){return Math.max(28,70-elapsed*1.4);}

function spawn(){
  const r=Math.random();
  let type='scoop';
  const badChance=Math.min(0.3,0.10+elapsed/200);
  if(r<badChance) type=Math.random()<0.5?'bomb':'fish';
  const x=40+Math.random()*(W-80);
  const ci=Math.floor(Math.random()*SCOOP_COLORS.length);
  items.push({type,x,y:-30,color:ci,rot:Math.random()*6.28,vr:(Math.random()-0.5)*0.06});
}

// ------- drawing helpers -------
function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}

function drawBG(){
  const g=ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,'#f9e2d4');g.addColorStop(1,'#f3cdb9');
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  // paw pattern
  ctx.globalAlpha=0.07;ctx.fillStyle='#c77b5e';
  for(let row=0;row<9;row++)for(let col=0;col<Math.ceil(W/110)+1;col++){
    const px=col*110+(row%2?55:10)+30, py=row*100+40;
    ctx.beginPath();ctx.ellipse(px,py+8,11,9,0,0,7);ctx.fill();
    for(let k=-1;k<=1;k++){ctx.beginPath();ctx.arc(px+k*9,py-6+Math.abs(k)*2,4.5,0,7);ctx.fill();}
  }
  ctx.globalAlpha=1;
  // floor
  ctx.fillStyle='#e5b39a';ctx.fillRect(0,H-140,W,140);
  ctx.fillStyle='rgba(0,0,0,0.06)';ctx.beginPath();ctx.ellipse(W/2,H-70,190,36,0,0,7);ctx.fill();
}

function drawScoop(x,y,ci,r=16){
  const [c1,c2]=SCOOP_COLORS[ci];
  ctx.fillStyle=c2;ctx.beginPath();ctx.arc(x,y+2,r,0,7);ctx.fill();
  ctx.fillStyle=c1;ctx.beginPath();ctx.arc(x,y,r,0,7);ctx.fill();
  // drips
  ctx.fillStyle=c1;
  for(let k=-1;k<=1;k++){ctx.beginPath();ctx.arc(x+k*r*0.55,y+r*0.75,r*0.32,0,7);ctx.fill();}
  ctx.fillStyle='rgba(255,255,255,0.5)';ctx.beginPath();ctx.arc(x-r*0.35,y-r*0.35,r*0.28,0,7);ctx.fill();
}
function drawCone(x,y,s=1){
  ctx.save();ctx.translate(x,y);ctx.scale(s,s);
  ctx.fillStyle='#e8a45c';ctx.beginPath();ctx.moveTo(-15,0);ctx.lineTo(15,0);ctx.lineTo(0,34);ctx.closePath();ctx.fill();
  ctx.strokeStyle='rgba(140,80,20,0.45)';ctx.lineWidth=1.5;
  ctx.beginPath();ctx.moveTo(-10,10);ctx.lineTo(6,10);ctx.moveTo(-6,20);ctx.lineTo(4,20);ctx.stroke();
  ctx.restore();
}
function drawBomb(x,y,rot){
  ctx.save();ctx.translate(x,y);ctx.rotate(rot*0.3);
  ctx.fillStyle='#4a4046';ctx.beginPath();ctx.arc(0,2,16,0,7);ctx.fill();
  ctx.fillStyle='#5d525a';ctx.beginPath();ctx.arc(0,0,15,0,7);ctx.fill();
  ctx.fillStyle='rgba(255,255,255,0.25)';ctx.beginPath();ctx.arc(-5,-5,5,0,7);ctx.fill();
  ctx.strokeStyle='#8a6a4a';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(4,-13);ctx.quadraticCurveTo(10,-20,16,-18);ctx.stroke();
  ctx.fillStyle='#f7b13f';ctx.beginPath();ctx.arc(17,-18,4,0,7);ctx.fill();
  ctx.fillStyle='#f76a3f';ctx.beginPath();ctx.arc(17,-19,2.2,0,7);ctx.fill();
  ctx.restore();
}
function drawFish(x,y,rot){
  ctx.save();ctx.translate(x,y);ctx.rotate(Math.sin(rot)*0.25);
  ctx.fillStyle='#9db3b8';
  ctx.beginPath();ctx.ellipse(0,0,16,9,0,0,7);ctx.fill();
  ctx.beginPath();ctx.moveTo(13,0);ctx.lineTo(24,-8);ctx.lineTo(24,8);ctx.closePath();ctx.fill();
  ctx.fillStyle='#7d9398';ctx.beginPath();ctx.ellipse(0,3,14,5,0,0,7);ctx.fill();
  ctx.fillStyle='#33383a';ctx.beginPath();ctx.arc(-8,-2,1.8,0,7);ctx.fill();
  // stink
  ctx.strokeStyle='rgba(120,150,90,0.6)';ctx.lineWidth=2;
  ctx.beginPath();ctx.moveTo(-2,-12);ctx.quadraticCurveTo(2,-17,-1,-22);ctx.stroke();
  ctx.restore();
}

function drawCat(x,y){
  const wob=Math.sin(t*0.08)*2;
  ctx.save();ctx.translate(x,y);
  // tail
  ctx.strokeStyle='#8b8f9c';ctx.lineWidth=13;ctx.lineCap='round';
  ctx.beginPath();ctx.moveTo(38,18);ctx.quadraticCurveTo(66,10,62,-16+wob);ctx.stroke();
  // body
  ctx.fillStyle='#9aa0ad';ctx.beginPath();ctx.ellipse(0,18,44,38,0,0,7);ctx.fill();
  // belly patch
  ctx.fillStyle='#e8a0ac';ctx.beginPath();ctx.ellipse(-14,32,13,10,0.3,0,7);ctx.fill();
  // head
  const hy=-36+wob;
  ctx.fillStyle='#9aa0ad';
  ctx.beginPath();ctx.moveTo(-30,hy-18);ctx.lineTo(-38,hy-42);ctx.lineTo(-12,hy-30);ctx.closePath();ctx.fill();
  ctx.beginPath();ctx.moveTo(30,hy-18);ctx.lineTo(38,hy-42);ctx.lineTo(12,hy-30);ctx.closePath();ctx.fill();
  ctx.fillStyle='#e8a0ac';
  ctx.beginPath();ctx.moveTo(-29,hy-22);ctx.lineTo(-34,hy-37);ctx.lineTo(-17,hy-29);ctx.closePath();ctx.fill();
  ctx.beginPath();ctx.moveTo(29,hy-22);ctx.lineTo(34,hy-37);ctx.lineTo(17,hy-29);ctx.closePath();ctx.fill();
  ctx.fillStyle='#9aa0ad';ctx.beginPath();ctx.ellipse(0,hy,36,32,0,0,7);ctx.fill();
  // face
  ctx.fillStyle='#3f3a45';
  if(catMood<0){ // sad X eyes briefly
    ctx.strokeStyle='#3f3a45';ctx.lineWidth=3;ctx.lineCap='round';
    [[-14,hy-4],[14,hy-4]].forEach(([ex,ey])=>{
      ctx.beginPath();ctx.moveTo(ex-4,ey-4);ctx.lineTo(ex+4,ey+4);ctx.moveTo(ex+4,ey-4);ctx.lineTo(ex-4,ey+4);ctx.stroke();
    });
  }else if(catMood>0){ // happy ^ eyes
    ctx.strokeStyle='#3f3a45';ctx.lineWidth=3;ctx.lineCap='round';
    [[-14,hy-3],[14,hy-3]].forEach(([ex,ey])=>{
      ctx.beginPath();ctx.moveTo(ex-5,ey+2);ctx.quadraticCurveTo(ex,ey-4,ex+5,ey+2);ctx.stroke();
    });
  }else{
    ctx.beginPath();ctx.arc(-14,hy-4,3.5,0,7);ctx.fill();
    ctx.beginPath();ctx.arc(14,hy-4,3.5,0,7);ctx.fill();
  }
  ctx.fillStyle='#e8a0ac';ctx.beginPath();ctx.moveTo(-4,hy+5);ctx.lineTo(4,hy+5);ctx.lineTo(0,hy+10);ctx.closePath();ctx.fill();
  ctx.strokeStyle='#3f3a45';ctx.lineWidth=1.6;ctx.lineCap='round';
  ctx.beginPath();ctx.moveTo(0,hy+10);ctx.quadraticCurveTo(-4,hy+15,-8,hy+13);ctx.moveTo(0,hy+10);ctx.quadraticCurveTo(4,hy+15,8,hy+13);ctx.stroke();
  // whiskers
  ctx.strokeStyle='rgba(63,58,69,0.6)';ctx.lineWidth=1.3;
  ctx.beginPath();
  ctx.moveTo(-30,hy+4);ctx.lineTo(-46,hy+1);ctx.moveTo(-30,hy+9);ctx.lineTo(-46,hy+11);
  ctx.moveTo(30,hy+4);ctx.lineTo(46,hy+1);ctx.moveTo(30,hy+9);ctx.lineTo(46,hy+11);
  ctx.stroke();
  ctx.restore();
}

function drawStackAndCone(x,y){
  drawCone(x,y-6,1.1);
  for(let i=0;i<stack.length;i++){
    const sw=Math.sin(t*0.1+i*0.5)*(i*0.7);
    drawScoop(x+sw,y-16-i*20,stack[i],14);
  }
}

function heart(x,y,s,filled){
  ctx.save();ctx.translate(x,y);ctx.scale(s,s);
  ctx.beginPath();ctx.moveTo(0,3);
  ctx.bezierCurveTo(-10,-6,-4,-14,0,-8);
  ctx.bezierCurveTo(4,-14,10,-6,0,3);
  ctx.closePath();
  if(filled){ctx.fillStyle='#e0526b';ctx.fill();}
  else{ctx.strokeStyle='rgba(180,90,100,0.5)';ctx.lineWidth=2;ctx.stroke();}
  ctx.restore();
}

function drawHomeIcon(cx,cy){
  ctx.fillStyle='#b0483f';
  ctx.beginPath();ctx.moveTo(cx,cy-8);ctx.lineTo(cx-9,cy);ctx.lineTo(cx-6,cy);ctx.lineTo(cx-6,cy+8);ctx.lineTo(cx+6,cy+8);ctx.lineTo(cx+6,cy);ctx.lineTo(cx+9,cy);ctx.closePath();ctx.fill();
}

function drawHUD(){
  // score card
  ctx.fillStyle='rgba(255,255,255,0.75)';rr(W/2-70,16,140,46,14);ctx.fill();
  ctx.fillStyle='#b0483f';ctx.font='bold 28px "Comic Sans MS",cursive,sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.fillText(score,W/2,40);
  ctx.font='bold 13px "Comic Sans MS",cursive,sans-serif';ctx.fillStyle='rgba(176,72,63,0.7)';
  ctx.fillText('TERBAIK '+best,W/2,76);
  // lives
  for(let i=0;i<3;i++)heart(34+i*30,40,1.6,i<lives);
  // home (back to hub)
  ctx.fillStyle='rgba(255,255,255,0.75)';rr(W-106,20,40,40,12);ctx.fill();
  drawHomeIcon(W-86,42);
  // mute
  ctx.fillStyle='rgba(255,255,255,0.75)';rr(W-58,20,40,40,12);ctx.fill();
  ctx.fillStyle='#b0483f';ctx.font='20px sans-serif';ctx.fillText(muted?'🔇':'🔊',W-38,41);
}

function drawButtons(){
  const by=H-92;
  [[46,-1,'◀'],[W-46,1,'▶']].forEach(([bx,,ch])=>{
    ctx.fillStyle='rgba(176,72,63,0.25)';rr(bx-38,by-38,76,76,18);ctx.fill();
    ctx.fillStyle='#fdf3ec';rr(bx-34,by-42,68,68,16);ctx.fill();
    ctx.strokeStyle='#b0483f';ctx.lineWidth=3;rr(bx-34,by-42,68,68,16);ctx.stroke();
    ctx.fillStyle='#b0483f';ctx.font='bold 30px sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText(ch,bx,by-8);
  });
}

function overlay(title,sub,sub2){
  ctx.fillStyle='rgba(58,32,26,0.55)';ctx.fillRect(0,0,W,H);
  ctx.fillStyle='#fdf3ec';rr(W/2-170,H/2-160,340,300,26);ctx.fill();
  ctx.strokeStyle='#b0483f';ctx.lineWidth=4;rr(W/2-170,H/2-160,340,300,26);ctx.stroke();
  ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.fillStyle='#b0483f';ctx.font='bold 36px "Comic Sans MS",cursive,sans-serif';
  ctx.fillText(title,W/2,H/2-104);
  ctx.font='20px "Comic Sans MS",cursive,sans-serif';ctx.fillStyle='#7a544a';
  sub.forEach((s,i)=>ctx.fillText(s,W/2,H/2-52+i*30));
  ctx.fillStyle='#b0483f';ctx.font='bold 24px "Comic Sans MS",cursive,sans-serif';
  const pulse=1+Math.sin(t*0.1)*0.04;
  ctx.save();ctx.translate(W/2,H/2+104);ctx.scale(pulse,pulse);ctx.fillText(sub2,0,0);ctx.restore();
  drawScoop(W/2-120,H/2-105,0,14);drawScoop(W/2+120,H/2-105,1,14);
}

// ------- game logic -------
function update(){
  t++;
  if(catMood!==0)catMood+=catMood>0?-1:1;
  if(state!=='play'){return;}
  elapsed+=1/60;
  // movement
  if(holdDir)targetX+=holdDir*7.5;
  targetX=Math.max(50,Math.min(W-50,targetX));
  catX+=(targetX-catX)*0.25;
  // spawn
  spawnTimer--;
  if(spawnTimer<=0){spawn();spawnTimer=spawnEvery();}
  const sp=fallSpeed();
  const catchY=CAT_Y-10, coneX=catX+34;
  for(let i=items.length-1;i>=0;i--){
    const it=items[i];
    it.y+=sp;it.rot+=it.vr;
    if(Math.abs(it.y-catchY)<26&&Math.abs(it.x-coneX)<40){
      if(it.type==='scoop'){
        stack.push(it.color);score+=10;combo++;catMood=25;
        burst(it.x,it.y,SCOOP_COLORS[it.color][0]);
        if(stack.length>=8){
          score+=50;popups.push({x:catX,y:CAT_Y-220,txt:'YUMMY! +50',life:60,color:'#e0526b'});
          burst(coneX,catchY-80,'#f7d774');stack=[];
        }
      }else{
        lives--;combo=0;stack=[];catMood=-40;shake=14;hurtFlash=12;
        burst(it.x,it.y,'#4a4046');
        popups.push({x:it.x,y:it.y,txt:'ADUH!',life:50,color:'#b0483f'});
        if(navigator.vibrate)navigator.vibrate(120);
        if(lives<=0){gameOver();}
      }
      items.splice(i,1);continue;
    }
    if(it.y>H+40){
      if(it.type==='scoop'&&combo>0){combo=0;popups.push({x:it.x,y:H-160,txt:'Duhh!',life:40,color:'rgba(122,84,74,0.8)'});}
      items.splice(i,1);
    }
  }
  for(let i=particles.length-1;i>=0;i--){const p=particles[i];p.x+=p.vx;p.y+=p.vy;p.vy+=0.15;p.life--;if(p.life<=0)particles.splice(i,1);}
  for(let i=popups.length-1;i>=0;i--){const p=popups[i];p.y-=0.8;p.life--;if(p.life<=0)popups.splice(i,1);}
  if(shake>0)shake--;
  if(hurtFlash>0)hurtFlash--;
}
function burst(x,y,color){
  for(let k=0;k<10;k++){
    const a=Math.random()*6.28,v=1.5+Math.random()*2.5;
    particles.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-1.5,life:24+Math.random()*14,color});
  }
}
function gameOver(){
  state='over';
  if(score>best){best=score;localStorage.setItem('kucing_es_best',best);}
}

function draw(){
  ctx.save();
  if(shake>0)ctx.translate((Math.random()-0.5)*shake,(Math.random()-0.5)*shake);
  drawBG();
  // catch line
  ctx.strokeStyle='rgba(176,72,63,0.3)';ctx.setLineDash([3,9]);ctx.lineWidth=3;
  ctx.beginPath();ctx.moveTo(0,CAT_Y-10);ctx.lineTo(W,CAT_Y-10);ctx.stroke();ctx.setLineDash([]);
  for(const it of items){
    if(it.type==='scoop')drawScoop(it.x,it.y,it.color);
    else if(it.type==='bomb')drawBomb(it.x,it.y,it.rot);
    else drawFish(it.x,it.y,it.rot);
  }
  // cat + cone
  ctx.fillStyle='rgba(0,0,0,0.10)';ctx.beginPath();ctx.ellipse(catX,CAT_Y+62,60,12,0,0,7);ctx.fill();
  drawCat(catX,CAT_Y);
  drawStackAndCone(catX+34,CAT_Y+8);
  for(const p of particles){ctx.globalAlpha=Math.min(1,p.life/15);ctx.fillStyle=p.color;ctx.beginPath();ctx.arc(p.x,p.y,3,0,7);ctx.fill();}
  ctx.globalAlpha=1;
  for(const p of popups){
    ctx.globalAlpha=Math.min(1,p.life/20);ctx.fillStyle=p.color;
    ctx.font='bold 22px "Comic Sans MS",cursive,sans-serif';ctx.textAlign='center';ctx.fillText(p.txt,p.x,p.y);
  }
  ctx.globalAlpha=1;
  drawHUD();
  if(state==='play')drawButtons();
  if(hurtFlash>0){ctx.fillStyle='rgba(224,82,107,'+(hurtFlash/12*0.25)+')';ctx.fillRect(0,0,W,H);}
  if(state==='start')overlay('Kucing Es Krim',['Geser kucing untuk menangkap','es krim yang jatuh.','Hindari bom & ikan busuk!'],'▶ KETUK UNTUK MAIN');
  if(state==='over')overlay('Game Over!',['Skor kamu: '+score,'Terbaik: '+best,''],'▶ MAIN LAGI');
  ctx.restore();
}
function loop(){update();draw();requestAnimationFrame(loop);}
loop();

// ------- input -------
function toGame(e){
  const rect=cv.getBoundingClientRect();
  const p=e.touches?e.touches[0]:e;
  return {x:(p.clientX-rect.left)/scale,y:(p.clientY-rect.top)/scale};
}
function pointerDown(e){
  e.preventDefault();
  const {x,y}=toGame(e);
  if(x>W-114&&x<W-66&&y>12&&y<68){window.location.href='../../index.html';return;}
  if(x>W-66&&y>12&&y<68){muted=!muted;if(muted)music.pause();else tryMusic();return;}
  if(state!=='play'){reset();state='play';tryMusic();return;}
  const by=H-92;
  if(y>by-50){
    if(x<100){holdDir=-1;return;}
    if(x>W-100){holdDir=1;return;}
  }
  dragging=true;targetX=x-34;
}
function pointerMove(e){
  if(!dragging)return;e.preventDefault();
  const {x}=toGame(e);targetX=x-34;
}
function pointerUp(){dragging=false;holdDir=0;}
cv.addEventListener('touchstart',pointerDown,{passive:false});
cv.addEventListener('touchmove',pointerMove,{passive:false});
cv.addEventListener('touchend',pointerUp);
cv.addEventListener('mousedown',pointerDown);
window.addEventListener('mousemove',pointerMove);
window.addEventListener('mouseup',pointerUp);
window.addEventListener('keydown',e=>{
  if(e.key==='a'||e.key==='A'||e.key==='ArrowLeft')holdDir=-1;
  if(e.key==='d'||e.key==='D'||e.key==='ArrowRight')holdDir=1;
  if((e.key===' '||e.key==='Enter')&&state!=='play'){reset();state='play';tryMusic();}
});
window.addEventListener('keyup',e=>{
  if(['a','A','ArrowLeft'].includes(e.key)&&holdDir===-1)holdDir=0;
  if(['d','D','ArrowRight'].includes(e.key)&&holdDir===1)holdDir=0;
});
</script>
</body>
</html>
