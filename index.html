<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Dulinan Space — Pilih Permainanmu!</title>
<meta name="description" content="Dulinan Space — arena bermain ceria berisi permainan seru untuk anak-anak.">
<meta name="theme-color" content="#19b9ee">
<meta name="application-name" content="Dulinan Space">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Dulinan Space">
<link rel="manifest" href="manifest.webmanifest?v=2">
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="64x64" href="assets/branding/favicon-64.png">
<link rel="apple-touch-icon" sizes="180x180" href="assets/branding/apple-touch-icon.png?v=2">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Baloo+2:wght@600;700;800&display=swap" rel="stylesheet">
<link rel="preload" href="assets/ui/game-illustrations-v1.webp" as="image" type="image/webp">
<link rel="stylesheet" href="style.css?v=9">
</head>
<body>

<div class="app-shell">
  <div class="world-bg" aria-hidden="true">
    <span class="cloud cloud-one"></span>
    <span class="cloud cloud-two"></span>
    <span class="floating-star star-one">★</span>
    <span class="floating-star star-two">✦</span>
    <span class="floating-star star-three">★</span>
    <span class="floating-star star-four">✦</span>
    <span class="hill hill-one"></span>
    <span class="hill hill-two"></span>
  </div>

  <main class="home-screen" id="home-screen">
    <header class="topbar">
      <button class="round-button menu-button" id="menu-button" type="button" aria-label="Buka menu">
        <span></span><span></span><span></span>
      </button>

      <div class="brand-lockup">
        <img
          class="brand-logo"
          src="assets/branding/icon-192.png"
          width="192"
          height="192"
          alt=""
          aria-hidden="true"
          fetchpriority="high"
        >
        <span class="brand-wordmark"><b>dulinan</b><small>SPACE</small></span>
      </div>

      <div class="star-score" role="img" aria-label="Koleksi 120 bintang">
        <span class="score-coin" aria-hidden="true">★</span>
        <strong>120</strong>
      </div>
    </header>

    <section class="hero" aria-labelledby="page-title">
      <div class="hero-sparkle sparkle-left" aria-hidden="true">★</div>
      <div class="hero-sparkle sparkle-right" aria-hidden="true">★</div>
      <h1 id="page-title">
        <span>Dulinan</span>
        <strong>Space</strong>
      </h1>
      <p><span>Ayo pilih permainanmu!</span> <b aria-hidden="true">🚀</b></p>
    </section>

    <section class="games-grid" id="games-grid" aria-label="Daftar permainan">
      <!-- Kartu permainan dibuat oleh script.js -->
    </section>

    <nav class="bottom-nav" aria-label="Navigasi utama">
      <button class="nav-item is-active" type="button" data-nav="Beranda" aria-current="page">
        <span class="nav-icon nav-home" aria-hidden="true">⌂</span>
        <span>Beranda</span>
      </button>
      <button class="nav-item" type="button" data-nav="Favorit">
        <span class="nav-icon" aria-hidden="true">♥</span>
        <span>Favorit</span>
      </button>
      <button class="nav-item" type="button" data-nav="Hadiah">
        <span class="nav-icon" aria-hidden="true">🎁</span>
        <span>Hadiah</span>
      </button>
      <button class="nav-item" type="button" data-nav="Profil">
        <span class="nav-icon" aria-hidden="true">●</span>
        <span>Profil</span>
      </button>
    </nav>
  </main>

  <div class="play-overlay" id="play-overlay" hidden>
    <button class="back-btn" id="back-btn" type="button">
      <span aria-hidden="true">←</span> Kembali
    </button>

    <div class="loading-state" id="loading-state">
      <div class="orbit-ring">
        <div class="orbit-rotator" aria-hidden="true">
          <div class="orbit-star">★</div>
        </div>
        <div class="loading-art game-sprite" id="loading-art" aria-hidden="true"></div>
      </div>
      <div class="play-game-name" id="loading-name"></div>
      <p class="play-status">Sedang menyiapkan petualangan…</p>
      <div class="progress-track" aria-hidden="true">
        <div class="progress-fill" id="progress-fill"></div>
      </div>
    </div>

    <div class="ready-state" id="ready-state" hidden>
      <div class="ready-art game-sprite" id="ready-art" aria-hidden="true"></div>
      <div class="play-game-name" id="ready-name"></div>
      <p class="ready-copy">Hore, permainanmu sudah siap!</p>
      <button class="play-btn" id="play-btn" type="button">Main Sekarang <span aria-hidden="true">▶</span></button>
    </div>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
</div>

<script src="script.js?v=8"></script>
</body>
</html>
